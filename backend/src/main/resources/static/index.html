<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>
        Government Training Management System
    </title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 700px;

            background: white;

            padding: 50px;

            text-align: center;

            border-radius: 14px;

            box-shadow:
                    0 5px 20px
                    rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1f3c5c;
        }

        p {
            color: #666;
            line-height: 1.7;
        }

        a {
            display: inline-block;

            margin-top: 20px;

            padding: 14px 25px;

            background: #1f3c5c;
            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;
        }

        a:hover {
            opacity: 0.9;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        Government Training Management System
    </h1>

    <p>
        Manage training programmes,
        officer nominations,
        eligibility,
        capacity and waiting lists.
    </p>

    <a href="/admin.html">
        Open Training Coordinator Dashboard
    </a>

</div>

</html>
